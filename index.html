<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }

        if ('caches' in window) {
            caches.keys().then(names => {
                for (let name of names) caches.delete(name);
            });
        }

        window.localStorage.clear();
        window.sessionStorage.clear();

        window.location.href = "https://maxkernw.github.io/tegel-gem/";
    </script>
    <meta http-equiv="refresh" content="0; url=https://maxkernw.github.io/tegel-gem/">
</head>
<body>
    <p>This page has moved. <a href="https://maxkernw.github.io/tegel-gem/">Click here if you are not redirected.</a></p>
</body>
</html>
